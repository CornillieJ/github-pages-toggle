<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>RepoTools</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    width: 300px;
    padding: 12px;
    background: #0d1117;
    color: #e6edf3;
  }
  button {
    position: relative;
    width: 100%;
    padding: 8px;
    margin-bottom: 8px;
    border: none;
    border-radius: 6px;
    background: #21262d;
    color: #e6edf3;
    cursor: pointer;
    font-size: 13px;
  }
  button:hover {
    background: #30363d;
  }
  .key-badge {
    position: absolute;
    top: -6px;
    right: -6px;
    background: #1f6feb;
    color: #ffffff;
    font-size: 9px;
    font-weight: 700;
    line-height: 1;
    padding: 2px 5px;
    border-radius: 8px;
    border: 1px solid #0d1117;
    pointer-events: none;
  }
  .divider {
    border-top: 1px solid #30363d;
    margin: 10px 0;
  }
  .hint {
    font-size: 11px;
    color: #8b949e;
    margin-top: 6px;
    line-height: 1.4;
  }
  .section-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #58a6ff;
    margin-bottom: 8px;
  }
  .row-2 {
    display: flex;
    gap: 8px;
  }
  .row-2 button {
    flex: 1;
  }
  .grid-2x2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .grid-2x2 button {
    margin-bottom: 0;
  }
  #repo-tools, #explore {
    display: none;
  }
  #no-repo {
    font-size: 12px;
    color: #8b949e;
    display: none;
  }
  #shortcuts-list {
    max-height: 250px;
    overflow-y: auto;
    margin-bottom: 8px;
    padding-right: 4px;
  }
  #shortcuts-list::-webkit-scrollbar {
    width: 6px;
  }
  #shortcuts-list::-webkit-scrollbar-thumb {
    background: #30363d;
    border-radius: 3px;
  }
  .shortcut-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 6px 0;
    border-bottom: 1px solid #21262d;
  }
  .shortcut-row:last-child {
    border-bottom: none;
  }
  .shortcut-text {
    min-width: 0;
  }
  .shortcut-label {
    display: block;
    font-size: 12.5px;
    color: #e6edf3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .shortcut-description {
    display: block;
    font-size: 10.5px;
    color: #8b949e;
    margin-top: 1px;
    line-height: 1.3;
  }
  .shortcut-row input {
    width: 26px;
    text-align: center;
    background: #161b22;
    color: #e6edf3;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 5px;
    font-size: 13px;
    flex-shrink: 0;
  }
  .shortcut-row input:focus {
    outline: none;
    border-color: #58a6ff;
  }
  #save-shortcuts {
    margin-top: 0;
  }
  .saved {
    color: #3fb950;
    font-size: 11px;
    display: block;
    text-align: center;
    visibility: hidden;
    margin-top: -4px;
    margin-bottom: 8px;
  }
  .error {
    color: #f85149;
    font-size: 11px;
    display: block;
    margin-bottom: 8px;
    visibility: hidden;
  }
</style>
</head>
<body>
  <div class="section-title">Shortcuts</div>
  <div id="shortcuts-list"></div>
  <button id="save-shortcuts">Save shortcuts</button>
  <span class="saved" id="saved-msg">Saved</span>
  <span class="error" id="error-msg"></span>
  <p class="hint">Leave a box empty to disable that shortcut. Shift+Toggle opens the result in a new tab.</p>

  <div class="divider"></div>

  <div class="section-title">GitHub &harr; Pages</div>
  <button id="toggle">Switch this tab</button>
  <button id="toggle-new-tab">Open in a new tab</button>

  <div class="divider"></div>

  <div id="repo-tools">
    <div class="section-title">Repo tools</div>
    <div class="row-2">
      <button data-action="copyHttps">Copy HTTPS</button>
      <button data-action="copySsh">Copy SSH</button>
    </div>
    <div class="grid-2x2">
      <button data-action="issues">Issues</button>
      <button data-action="prs">Pull requests</button>
      <button data-action="actionsTab">Actions</button>
      <button data-action="releases">Releases</button>
    </div>

    <div class="divider"></div>

    <div id="explore">
      <div class="section-title">Explore elsewhere</div>
      <button data-action="deepwiki">DeepWiki</button>
      <button data-action="gitdiagram">GitDiagram</button>
    </div>
  </div>

  <p id="no-repo">Open a GitHub repo or its Pages site to use repo tools.</p>

  <script src="url-mapper.js"></script>
  <script src="shortcuts.js"></script>
  <script src="badge.js"></script>
  <script src="popup.js"></script>
</body>
</html>
