<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>RepoTools</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    width: 260px;
    padding: 12px;
    background: #0d1117;
    color: #e6edf3;
  }
  button {
    width: 100%;
    padding: 8px;
    margin-bottom: 8px;
    border: none;
    border-radius: 6px;
    background: #21262d;
    color: #e6edf3;
    cursor: pointer;
    font-size: 13px;
  }
  button:hover {
    background: #30363d;
  }
  .divider {
    border-top: 1px solid #30363d;
    margin: 10px 0;
  }
  label {
    display: block;
    font-size: 12px;
    margin-bottom: 4px;
    color: #8b949e;
  }
  .key-row {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  input[type="text"] {
    width: 36px;
    text-align: center;
    background: #161b22;
    color: #e6edf3;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 6px;
    font-size: 14px;
  }
  #save {
    width: auto;
    padding: 6px 10px;
    margin: 0;
  }
  .saved {
    color: #3fb950;
    font-size: 11px;
    margin-left: 4px;
    visibility: hidden;
  }
  .hint {
    font-size: 11px;
    color: #8b949e;
    margin-top: 8px;
    line-height: 1.4;
  }
  .section-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #58a6ff;
    margin-bottom: 8px;
  }
  .row-2 {
    display: flex;
    gap: 8px;
  }
  .row-2 button {
    flex: 1;
  }
  .grid-2x2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .grid-2x2 button {
    margin-bottom: 0;
  }
  #repo-tools, #explore {
    display: none;
  }
  #no-repo {
    font-size: 12px;
    color: #8b949e;
    display: none;
  }
</style>
</head>
<body>
  <div class="section-title">Shortcut key</div>
  <div class="key-row">
    <input type="text" id="key" maxlength="1" />
    <button id="save">Save</button>
    <span class="saved" id="saved-msg">Saved</span>
  </div>
  <p class="hint">Shift+key opens the result in a new tab instead.</p>

  <div class="divider"></div>

  <div class="section-title">GitHub &harr; Pages</div>
  <button id="toggle">Switch this tab</button>
  <button id="toggle-new-tab">Open in a new tab</button>

  <div class="divider"></div>

  <div id="repo-tools">
    <div class="section-title">Repo tools</div>
    <div class="row-2">
      <button id="copy-https">Copy HTTPS</button>
      <button id="copy-ssh">Copy SSH</button>
    </div>
    <div class="grid-2x2">
      <button id="link-issues">Issues</button>
      <button id="link-prs">Pull requests</button>
      <button id="link-actions">Actions</button>
      <button id="link-releases">Releases</button>
    </div>

    <div class="divider"></div>

    <div id="explore">
      <div class="section-title">Explore elsewhere</div>
      <button id="link-deepwiki">DeepWiki</button>
      <button id="link-gitdiagram">GitDiagram</button>
    </div>
  </div>

  <p id="no-repo">Open a GitHub repo or its Pages site to use repo tools.</p>

  <script src="url-mapper.js"></script>
  <script src="badge.js"></script>
  <script src="popup.js"></script>
</body>
</html>
